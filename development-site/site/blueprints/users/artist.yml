name: Artist
title: Artist
description: Can post to the stream and manage their own posts.

permissions:
  access:
    panel: true
    site: true
    users: false
    system: false
  pages:
    create: true
    delete: true
    update: true
    changeSlug: false
    changeTemplate: false
  files:
    create: true
    delete: true
    update: true
  site:
    update: false
  user:
    update: true
